$schema: https://json-schema.org/draft/2020-12/schema
$id: https://olympion.dev/schemas/dpdl-v1.yaml
title: Olympion Digital Professional Definition Language v1
description: A versioned contract for an employee catalog digital professional definition.
type: object
additionalProperties: false
required:
  - id
  - name
  - version
  - description
  - role
  - capabilities
properties:
  id:
    type: string
    description: Stable unique identifier using lowercase letters, digits, and hyphens.
    pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
  name:
    type: string
    minLength: 1
  version:
    type: string
    description: Semantic version of this definition.
    pattern: ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$
  description:
    type: string
    minLength: 1
  role:
    type: string
    minLength: 1
  capabilities:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: string
      minLength: 1
  skills:
    type: array
    uniqueItems: true
    items:
      type: string
      minLength: 1
  responsibilities:
    type: array
    items:
      type: string
      minLength: 1
  tools:
    type: array
    uniqueItems: true
    items:
      type: string
      minLength: 1
  guardrails:
    type: array
    items:
      type: string
      minLength: 1
  extensions:
    type: object
    description: Namespaced custom fields that do not change the v1 contract.
    additionalProperties: true
